    let isDrawing = false;
    let isSoundEnabled = true;
    let audioCtx = null;
    let isAudioUnlocked = false;

    // --- iOS対応：ボタンを押した瞬間に確実にロックを解除する処理 ---
    function initAudio() {
      if (isAudioUnlocked) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioCtx = new AudioContext();

        // サイレントオシレーター（無音の波）を流してブラウザに再生許可を強制させる
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.value = 0; // 無音
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(0);
        osc.stop(audioCtx.currentTime + 0.01);

        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        isAudioUnlocked = true;
      } catch (e) {
        console.error("Audio unlock failed:", e);
      }
    }

    // 画面タップ時にも念のため初期化を試みる
    ['touchstart', 'click'].forEach(evt => {
        document.body.addEventListener(evt, initAudio, { once: true, capture: true, passive: true });
    });

    soundToggle.addEventListener('click', (e) => {
      e.preventDefault();
      initAudio(); // 音声ボタンを押した瞬間に強制アンロック
      isSoundEnabled = !isSoundEnabled;
      soundToggle.innerText = isSoundEnabled ? '🔊' : '🔇';
      soundToggle.classList.toggle('opacity-50', !isSoundEnabled);
    });

    function playTone(freq, type, duration, vol = 0.1) {
      if (!isSoundEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playShakeSound() {
      const interval = setInterval(() => {
        if (!isDrawing) { clearInterval(interval); return; }
        playTone(300 + Math.random() * 200, 'square', 0.05, 0.05);
      }, 80);
    }

    function playResultSound(result) {
      if (result === '大吉') {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.3, 0.2), i * 150));
      } else if (result === '大凶' || result === '凶') {
        playTone(150, 'sawtooth', 1.0, 0.3);
        setTimeout(() => playTone(100, 'sawtooth', 1.5, 0.3), 300);
      } else {
        playTone(659.25, 'sine', 0.1, 0.2);
        setTimeout(() => playTone(880.00, 'sine', 0.4, 0.2), 100);
      }
    }

    function drawFortune(mode) {
      const rates = probabilities[mode];
      const totalRate = rates.reduce((sum, item) => sum + item.rate, 0);
      const rand = Math.random() * totalRate;
      let currentSum = 0;
      for (const item of rates) {
        currentSum += item.rate;
        if (rand <= currentSum) return item.name;
      }
      return rates[0].name;
    }

    function shootConfetti() {
      const end = Date.now() + 3000;
      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#ef4444'] });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#ef4444'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    // =====================================================================
    //  保存まわり
    //
    //  【ここが唯一「データの置き場所」を知っている場所】
    //  今の保存先はブラウザの localStorage（＝端末の中だけ。他の人には見えない）。
    //  あとで本物のDB（Supabase等）に移すときは、この historyStore の中身だけを
    //  差し替えればよく、呼び出し側（下のイベント処理）は一切変えなくてよい。
    //
    //  そのために、いま同期処理で済む場面でもあえて async にしてある。
    //  サーバーのDBは必ず「待ち」が発生するので、最初から待つ形にしておくと
    //  差し替えのときに呼び出し側を書き直さずに済む。
    // =====================================================================
    const historyStore = {
      KEY: 'omikuji.history.v1',      // 履歴の保存キー
      NAME_KEY: 'omikuji.name.v1',    // 名前の保存キー
      MAX: 200,                       // 保存する上限件数（古いものから捨てる）

      // localStorage はプライベートブラウズや設定次第で例外を投げる。
      // おみくじ本体を止めないよう、失敗しても握りつぶして既定値を返す。
      _read(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch (err) {
          return fallback;
        }
      },
      _write(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (err) {
          return false;
        }
      },

      async load() {
        const list = this._read(this.KEY, []);
        return Array.isArray(list) ? list : [];
      },
      async add(record) {
        const list = await this.load();
        list.unshift(record);                 // 新しいものが先頭
        this._write(this.KEY, list.slice(0, this.MAX));
      },
      async clear() {
        this._write(this.KEY, []);
      },
      async getName() {
        const name = this._read(this.NAME_KEY, '');
        return typeof name === 'string' ? name : '';
      },
      async setName(name) {
        this._write(this.NAME_KEY, name);
      }
    };

    // --- 表示用の定数 ---
    const FORTUNE_ORDER = ['大吉', '中吉', '小吉', '吉', '末吉', '凶', '大凶'];
    const FORTUNE_COLOR = {
      '大吉': 'bg-red-600', '中吉': 'bg-orange-500', '小吉': 'bg-amber-500',
      '吉': 'bg-green-600', '末吉': 'bg-teal-600', '凶': 'bg-gray-500', '大凶': 'bg-gray-800'
    };
    const MODE_LABEL = { lucky: 'ラッキー', standard: '標準', thorny: 'いばらの道' };

    // 名前の掃除。前後の空白を落とし、長すぎるものは切る。空なら「名無しさん」
    function cleanName(raw) {
      const name = (raw || '').trim().replace(/\s+/g, ' ').slice(0, 20);
      return name === '' ? '名無しさん' : name;
    }

    // 「2026-08-31 14:05」の形にする（端末のローカル時刻）
    function formatDateTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const p = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
           + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    // 履歴ボタンの表示・件数を最新にする
    async function refreshHistoryButton() {
      const list = await historyStore.load();
      historyCount.innerText = list.length === 0 ? '' : '（' + list.length + '回）';
      historyBtn.classList.toggle('hidden', list.length === 0);
    }

    // 履歴モーダルの中身を組み立てる
    async function renderHistory() {
      const list = await historyStore.load();
      const total = list.length;

      historyTitle.innerText = cleanName(nameInput.value) + 'の運勢履歴';

      if (total === 0) {
        historySummary.innerText = 'まだ1回も引いていません';
        historyStats.innerHTML = '';
        historyList.innerHTML = '<p class="text-center text-sm text-gray-400 py-6">履歴がありません</p>';
        return;
      }

      historySummary.innerText = '全' + total + '回（この端末に保存されています）';

      // --- 運勢ごとの回数と割合 ---
      const counts = {};
      list.forEach(r => { counts[r.fortune] = (counts[r.fortune] || 0) + 1; });

      historyStats.innerHTML = FORTUNE_ORDER
        .filter(f => counts[f])
        .map(f => {
          const n = counts[f];
          const pct = Math.round(n / total * 1000) / 10;   // 小数第1位まで
          const color = FORTUNE_COLOR[f] || 'bg-gray-400';
          return '<div class="flex items-center gap-2 mb-1.5">'
               +   '<span class="w-10 shrink-0 text-xs font-bold text-gray-700">' + f + '</span>'
               +   '<span class="grow h-3 bg-gray-100 rounded-full overflow-hidden">'
               +     '<span class="block h-full ' + color + ' rounded-full" style="width:' + Math.max(pct, 2) + '%"></span>'
               +   '</span>'
               +   '<span class="w-16 shrink-0 text-right text-[11px] text-gray-500">' + n + '回 ' + pct + '%</span>'
               + '</div>';
        }).join('');

      // --- 直近20件の一覧 ---
      const recent = list.slice(0, 20);
      historyList.innerHTML =
          '<h3 class="text-xs font-bold text-gray-400 mb-2 border-t border-gray-100 pt-3">直近'
        + recent.length + '件</h3>'
        + recent.map(r =>
            '<div class="flex items-center gap-2 py-1.5 border-b border-gray-50 last:border-0">'
          +   '<span class="w-10 shrink-0 text-sm font-bold text-gray-800">' + escapeHtml(r.fortune) + '</span>'
          +   '<span class="grow text-[11px] text-gray-500">' + escapeHtml(r.name || '') + '</span>'
          +   '<span class="shrink-0 text-[10px] text-gray-400">'
          +     escapeHtml(MODE_LABEL[r.mode] || '') + ' / ' + formatDateTime(r.at)
          +   '</span>'
          + '</div>').join('');
    }

    // 名前は利用者が自由に入れられるので、画面に出す前にHTMLとして解釈されないようにする
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function openHistory() {
      renderHistory();
      historyOverlay.classList.remove('opacity-0', 'pointer-events-none');
    }
    function closeHistory() {
      historyOverlay.classList.add('opacity-0', 'pointer-events-none');
    }

    historyBtn.addEventListener('click', openHistory);
    historyCloseBtn.addEventListener('click', closeHistory);
    historyOverlay.addEventListener('click', (e) => {
      if (e.target === historyOverlay) closeHistory();   // 背景タップで閉じる
    });

    historyClearBtn.addEventListener('click', async () => {
      if (!confirm('この端末に保存した運勢の履歴をすべて消します。よろしいですか？')) return;
      await historyStore.clear();
      await refreshHistoryButton();
      await renderHistory();
    });

    // 名前は入力するたびに覚えておく（次に開いたとき入っている状態にする）
    nameInput.addEventListener('input', () => {
      historyStore.setName(nameInput.value);
    });

    // --- 起動時の復元 ---
    (async () => {
      nameInput.value = await historyStore.getName();
      await refreshHistoryButton();
    })();

    drawBtn.addEventListener('click', (e) => {
      e.preventDefault();
      initAudio(); // 【重要】おみくじボタンを押した瞬間に強制アンロック

      if (isDrawing) return;
      isDrawing = true;

      const selectedMode = document.querySelector('input[name="mode"]:checked').value;
      drawBtn.disabled = true;
      drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
      modeRadios.forEach(radio => radio.disabled = true);
      nameInput.disabled = true;
      
      omikujiBox.classList.add('shaking');
      playShakeSound();
      
      setTimeout(async () => {
        isDrawing = false;
        omikujiBox.classList.remove('shaking');

        const result = drawFortune(selectedMode);
        showResult(result);

        // 引いた結果を履歴に残す（保存に失敗してもおみくじ自体は止めない）
        await historyStore.add({
          at: new Date().toISOString(),
          name: cleanName(nameInput.value),
          mode: selectedMode,
          fortune: result
        });
        await refreshHistoryButton();
      }, 2000);
    });

    function showResult(result) {
      resultText.innerText = result;
      
      // 対象の運勢のメッセージ配列からランダムに1つ取得
      const detailsArray = fortuneDetails[result];
      const randomDetail = detailsArray[Math.floor(Math.random() * detailsArray.length)];
      
      resultMsg.innerText = randomDetail.msg;
      resultAction.innerText = randomDetail.action;
      
      resultCard.className = 'w-[85%] max-w-[320px] md:max-w-[360px] h-auto min-h-[420px] py-6 px-4 flex flex-col items-center justify-center rounded-2xl shadow-2xl transition-all duration-500 ease-out transform scale-50 opacity-0 relative bg-white border-8 border-gray-800 my-auto';
      adviceArea.classList.add('opacity-0');

      if (result === '大吉') {
        resultCard.classList.add('aura-daikichi');
        shootConfetti();
      } else if (result === '大凶') {
        resultCard.classList.add('aura-daikyo');
      } else if (result === '凶') {
        resultCard.classList.add('bg-gray-800', 'border-black');
        resultText.classList.add('text-red-500');
        document.querySelectorAll('.fortune-label').forEach(el => el.classList.add('text-gray-500'));
        resultMsg.classList.add('text-gray-300');
        resultAction.classList.add('bg-gray-700', 'text-white', 'border-gray-600');
      }

      resultOverlay.classList.remove('opacity-0', 'pointer-events-none');
      
      setTimeout(() => {
        playResultSound(result);
        resultCard.classList.remove('scale-50', 'opacity-0');
        resultCard.classList.add('scale-100', 'opacity-100');
      }, 100);

      setTimeout(() => {
        adviceArea.classList.remove('opacity-0');
        adviceArea.classList.add('opacity-100');
      }, 600);

      setTimeout(() => {
        closeBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
        closeBtn.classList.add('opacity-100', 'translate-y-0');
      }, 1500);
    }

    closeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      initAudio(); // 閉じるボタンのタップでも保険でロック解除
      
      resultCard.classList.remove('scale-100', 'opacity-100');
      resultCard.classList.add('scale-50', 'opacity-0');
      closeBtn.classList.remove('opacity-100', 'translate-y-0');
      closeBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      
      setTimeout(() => {
        resultOverlay.classList.add('opacity-0', 'pointer-events-none');
        drawBtn.disabled = false;
        drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        modeRadios.forEach(radio => radio.disabled = false);
        nameInput.disabled = false;
        
        document.querySelectorAll('.fortune-label').forEach(el => el.classList.remove('text-gray-500'));
        resultText.classList.remove('text-red-500');
        resultMsg.classList.remove('text-gray-300');
        resultAction.classList.remove('bg-gray-700', 'text-white', 'border-gray-600');
      }, 500);
    });
  </script>
</body>
</html>
